<h1>Pokédex</h1>

<app-region-nav />

@if (loading()) {
  <p class="status-message">Cargando...</p>
} @else if (pokemonList().length === 0) {
  <p class="status-message">No hay Pokémon registrados para esta región.</p>
} @else {
  <div class="grid">
    @for (item of pokemonList().slice(0, visibleCount()); track item.name) {
      <app-pokemon-card [name]="item.name" />
    }
  </div>

  @if (visibleCount() < pokemonList().length) {
    <div class="load-more">
      <button type="button" (click)="showMore()">Cargar más</button>
    </div>
  }
}
